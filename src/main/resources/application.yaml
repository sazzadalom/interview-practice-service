
server:
  port: ${SERVER_PORT:9091}
  shutdown: graceful

spring:
  application:
    name: interview-practice-service


  springdoc:
    api-docs:
      enabled: true
      path: /v3/api-docs

    swagger-ui:
      enabled: true
      path: /swagger-ui.html
      operations-sorter: alpha
      tags-sorter: alpha
      display-request-duration: true

      show-actuator: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_practice_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"


services:
  question-bank:
    base-url: ${QUESTION_BANK_SERVICE_URL:http://localhost:9090}
